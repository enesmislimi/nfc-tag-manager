name: NFC Tag Manager CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*.*.*' # Déclenche la prod lors de la création d'un tag de version (ex: v1.0.0)
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permet de déclencher la production manuellement depuis l'interface GitHub

# Permissions nécessaires pour publier l'image Docker sur le registre GitHub (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  # 🧪 PARTIE 1 : INTERGRATION CONTINUE (CI)
  test-and-typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: nfc_tags
          POSTGRES_PASSWORD: supersecretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: npm install
    - name: Typecheck TypeScript
      run: npx tsc --noEmit
    - name: Run tests with Jest
      run: npm test

  # 📦 PARTIE 2 : BUILD & PUSH DOCKER IMAGE
  # Ce job s'exécute uniquement si la partie CI est verte
  build-and-push-docker:
    needs: test-and-typecheck
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ id.meta.outputs.tags }}
        labels: ${{ id.meta.outputs.labels }}

  # 🚀 PARTIE 3 : DEPLOIEMENT EN STAGING (AUTOMATIQUE)
  deploy-staging:
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: staging # 👈 Liaison avec l'environnement GitHub Staging
    steps:
    - name: Simuler le déploiement sur l'environnement de Staging
      run: |
        echo "Déploiement en cours sur l'environnement de Staging..."
        echo "Connexion sécurisée via l'hôte : ${{ secrets.DEPLOY_HOST }}"
        echo "Récupération de la dernière image Docker et redémarrage du conteneur..."
        echo "✅ Application déployée avec succès sur le Staging !"

  # 🚀 PARTIE 4 : DEPLOIEMENT EN PRODUCTION (MANUEL OU VIA TAG)
  deploy-production:
    needs: build-and-push-docker
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production # 👈 Liaison avec l'environnement GitHub Production (soumis à validation)
    steps:
    - name: Simuler le déploiement sur l'environnement de Production
      run: |
        echo "Déploiement en cours sur l'environnement de Production..."
        echo "Connexion sécurisée via l'hôte : ${{ secrets.DEPLOY_HOST }}"
        echo "Mise à jour des conteneurs en production..."
        echo "✅ Application en ligne et 100% opérationnelle en Production !"